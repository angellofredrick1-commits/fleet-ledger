<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2025">
<title>Bolt Fleet Ledger</title>
<meta name="description" content="Register cars and drivers, record weekly hesabu and expenses, and track profit after the loan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='3' fill='%23e8a317' stroke='%231a2025' stroke-width='2.5'/%3E%3Ctext x='16' y='20.5' font-family='Arial' font-weight='900' font-size='9' text-anchor='middle' fill='%231a2025'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="plate-mark" aria-hidden="true">T&nbsp;FLEET</span>
      <div><h1>Bolt Fleet Ledger</h1><small>Hesabu, expenses and loan, per car</small></div>
    </div>
    <div class="period">
      <label for="periodMonth" class="eyebrow">Period</label>
      <input type="month" id="periodMonth">
      <button class="btn small" id="periodAll" type="button" data-act="period-all">All time</button>
    </div>
    <div class="actions quick" id="quick"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Sections"></nav></div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
